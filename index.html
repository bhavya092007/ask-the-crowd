
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ask The Crowd</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="container">


        <!-- =================================
             HEADER
        ================================== -->

        <h1>Ask The Crowd</h1>

        <p>
            Ask something. Let the crowd decide.
        </p>


        <!-- =================================
             ASK QUESTION
        ================================== -->

        <div class="question-box">

            <input
                type="text"
                id="questionInput"
                placeholder="Ask the crowd something..."
                maxlength="200"
            >

            <button id="askButton">
                Ask
            </button>

        </div>


        <!-- =================================
             ALL QUESTIONS
        ================================== -->

        <section class="questions-section">

            <div class="section-header">

                <h2>
                    Questions
                </h2>

                <span id="questionCount">
                    0
                </span>

            </div>


            <div id="questionsList">

                <!-- Questions will appear here -->

            </div>

        </section>


        <!-- =================================
             SINGLE QUESTION VIEW
        ================================== -->

        <section
            id="questionSection"
            class="hidden"
        >


            <button
                id="backButton"
                class="back-button"
            >
                ← Back to questions
            </button>


            <h2 id="questionText">
                Question
            </h2>


            <!-- YES / NO -->

            <div class="buttons">

                <button id="yesButton">
                    YES
                </button>

                <button id="noButton">
                    NO
                </button>

            </div>


            <!-- CROWD RESULT -->

            <div class="crowd-result">

                <div class="result-top">

                    <span>
                        THE CROWD THINKS
                    </span>

                    <span>

                        <b id="totalVotes">
                            0
                        </b>

                        votes

                    </span>

                </div>


                <!-- YES -->

                <div class="vote-row">

                    <div class="vote-info">

                        <span>
                            YES
                        </span>

                        <strong id="yesPercent">
                            0%
                        </strong>

                    </div>


                    <div class="vote-track">

                        <div
                            id="yesBar"
                            class="vote-fill yes-fill"
                        ></div>

                    </div>

                </div>


                <!-- NO -->

                <div class="vote-row">

                    <div class="vote-info">

                        <span>
                            NO
                        </span>

                        <strong id="noPercent">
                            0%
                        </strong>

                    </div>


                    <div class="vote-track">

                        <div
                            id="noBar"
                            class="vote-fill no-fill"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- =================================
                 EXPLANATION
            ================================== -->

            <div class="explanation-section">

                <h3>
                    What's your take?
                </h3>


                <textarea
                    id="explanationInput"
                    placeholder="Tell the crowd why..."
                    maxlength="500"
                ></textarea>


                <button id="explanationButton">
                    Share your take
                </button>

            </div>


            <!-- =================================
                 EXPLANATIONS
            ================================== -->

            <div class="opinions-section">

                <h3>
                    What people are saying
                </h3>


                <div id="explanationList">

                </div>

            </div>


        </section>


        <!-- FOOTER -->

        <footer>

            <p>
                Built with curiosity • powered by the crowd
            </p>

        </footer>


    </main>


    <!-- Firebase -->

    <script
        type="module"
        src="firebase.js"
    ></script>


    <!-- Main JS -->

    <script
        type="module"
        src="script.js"
    ></script>


</body>

</html>
